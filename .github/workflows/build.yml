name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('loader/platformio.ini') }}

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake
          pip install platformio -r requirements.txt

      - name: Build
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: two-to-tango
          path: |
            out/loader.bin
            out/edgetx.bin
            out/elrs.bin

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/loader.bin
            out/edgetx.bin
            out/elrs.bin
