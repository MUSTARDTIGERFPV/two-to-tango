; Resident loader for the TBS Tango 2, installed by the TBS bootloader at
; 0x0800C000. Boots EdgeTX, flashes it and the radio images over USB CDC, and
; has peek/poke and a RAM task runner for development. See src/main.cpp.
[env:loader]
platform = ststm32@15.1.0
; The registry no longer has the framework 15.1.0 wants (4.20100); 4.20600 is
; the closest it still publishes. The toolchain stays 15.1.0's gcc 9.2.1, which
; the ExpressLRS image and EdgeTX builds use too.
platform_packages =
    platformio/framework-arduinoststm32@4.20600.231001
    platformio/toolchain-gccarmnoneeabi@1.90201.191206
    platformio/framework-cmsis@2.50700.210515
board = disco_f407vg
framework = arduino
board_build.ldscript = tango2_monitor.ld
extra_scripts = post:vtor.py
board_build.f_cpu = 168000000L
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    -D USBD_VID=0x0483
    -D USBD_PID=0x5740
    -D HSE_VALUE=8000000U
    -I ../abi
